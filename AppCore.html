        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.textContent = msg;
        container.appendChild(t);

    function localLoad() {
        try {
            const raw = localStorage.getItem(LS_KEY);
            if (raw) {
                const saved = JSON.parse(raw);
                Object.keys(saved).forEach(k => { if (DB.hasOwnProperty(k)) DB[k] = saved[k]; });
                return true;
            }
        } catch (e) { console.warn('Error leyendo localStorage', e); }
        return false;
    }

    function genId(prefix) { return prefix + '-' + Date.now().toString(36).toUpperCase(); }

    const LocalEngine = {
        login(pin) {
            const user = DB.usuarios.find(u => String(u.PIN) === String(pin) && u.Activo);
            if (!user) return { success: false, error: 'PIN incorrecto o usuario inactivo' };
            return { success: true, usuario: { id: user.ID, nombre: user.Nombre, rol: user.Rol, iniciales: user.Iniciales, puesto: user.Puesto, activoAsignado: user.activoAsignado || 'TODOS' } };

            item.Avance = item.CantidadProgramada ? Math.round(item.CantidadEjecutada / item.CantidadProgramada * 100) : 0;

            localSave(); return { success: true };

    function gasCall(funcName, payload, onSuccess, onError) {
        if (IS_GAS) {
            google.script.run
                .withSuccessHandler(function (result) {
                    if (result && result.success === false) {
                        toast(result.error || 'Error del servidor', 'error');
                        if (onError) onError(result);
                    } else { if (onSuccess) onSuccess(result); }
                })
                .withFailureHandler(function (err) {
                    toast('Error de conexión: ' + err.message, 'error');
                    if (onError) onError(err);
                })
            [funcName](payload);
        } else {
            // MODO LOCAL: usar LocalEngine
            console.log(`📦 LOCAL [${funcName}]`, payload);
            try {
                const fn = LocalEngine[funcName];
                const result = fn ? fn(payload) : { success: true, id: genId('GEN') };
                if (result && result.success === false) {
                    toast(result.error || 'Error local', 'error');
                    if (onError) onError(result);
                } else {
                    if (onSuccess) onSuccess(result);
                }
            } catch (e) {
                console.error('LocalEngine error:', e);
                if (onSuccess) onSuccess({ success: true, id: genId('ERR') });
            }
        }
    }

        init() {

            const btnLogin = $('btnLogin');
            if (btnLogin) btnLogin.onclick = () => this.attemptLogin();

            const btnHam = $('btnHamburger');
            if (btnHam) btnHam.onclick = () => { $('sidebar').classList.add('open'); $('sidebarOverlay').classList.add('active'); };
            const overlay = $('sidebarOverlay');
            if (overlay) overlay.onclick = () => this.closeSidebar();

            const dateLabel = $('topbarDate');
            if (dateLabel) dateLabel.textContent = new Date().toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

            if (!IS_GAS) {
                // Cargar datos de localStorage o sembrar datos iniciales
                if (!localLoad()) localSeed();
                console.log('📱 MODO LOCAL — PINs: 1234 (Admin), 2222 (Supervisor), 3333 (Segurista), 4444 (Líder)');
            }
        },

        setupPinInputs() {
            const pins = document.querySelectorAll('.pin-digit');
            pins.forEach((input, i) => {
                input.oninput = () => { if (input.value && i < 3) pins[i + 1].focus(); if (i === 3 && input.value) this.attemptLogin(); };
                input.onkeydown = (e) => { if (e.key === 'Backspace' && !input.value && i > 0) pins[i - 1].focus(); };
            });
        },

        attemptLogin() {
            const pin = Array.from(document.querySelectorAll('.pin-digit')).map(i => i.value).join('');
            if (pin.length < 4) return;
            console.log('Attempting login with PIN:', pin);
            toast('Verificando PIN...', 'info');

            const btn = $('btnLogin');
            if (btn) { btn.disabled = true; btn.innerText = 'Verificando...'; }

            gasCall('login', pin, (result) => {
                console.log('Login result:', result);
                if (result.success === false) {
                    if (btn) { btn.disabled = false; btn.innerText = 'Ingresar'; }
                    $('loginError').textContent = result.error || 'PIN incorrecto';
                    toast('Error: ' + (result.error || 'PIN incorrecto'), 'error');
                    document.querySelectorAll('.pin-digit').forEach(i => i.value = '');
                    document.querySelector('.pin-digit').focus();
                    return;
                }
                this.currentUser = result.usuario;
                this.currentActivo = this.currentUser.activoAsignado || 'TODOS';
                this.enterApp();
            }, (err) => {
                console.error('Login GAS error:', err);
                toast('Error de sistema: ' + err.message, 'error');
                if (btn) { btn.disabled = false; btn.innerText = 'Ingresar'; }
                $('loginError').textContent = (err && err.error) || 'Error de conexión';
                document.querySelectorAll('.pin-digit').forEach(i => i.value = '');
                document.querySelector('.pin-digit').focus();
            });
        },

        enterApp() {
            $('screen-login').classList.add('hidden');
            $('app-shell').style.display = 'flex';
            $('userAvatar').textContent = this.currentUser.iniciales;
            $('userName').textContent = this.currentUser.nombre;

            const ROLE_BADGES = { 'ADMIN': { cls: 'badge badge-green', txt: '🛡 ADMIN' }, 'SUPERVISOR': { cls: 'badge badge-purple', txt: '📋 SUPERVISOR' }, 'SEGURISTA': { cls: 'badge badge-orange', txt: '🔍 SEGURISTA' }, 'LIDER': { cls: 'badge badge-blue', txt: '👷 LÍDER' } };
            const rb = ROLE_BADGES[this.currentUser.rol] || { cls: 'badge badge-blue', txt: this.currentUser.rol };
            const roleBadge = $('topbarRoleBadge');
            if (roleBadge) { roleBadge.style.display = 'inline-flex'; roleBadge.className = rb.cls; roleBadge.textContent = rb.txt; }

            this.refreshData(() => {
                this.buildNav();
                this.navigate(this.currentUser.rol === 'LIDER' ? 'mis-actividades' : 'control-desk');
            });
        },

            if (!IS_GAS) {

                return;
            }
            toast('Cargando datos...', 'info');
            google.script.run.withSuccessHandler(data => {
                Object.assign(DB, data);
                toast('Datos actualizados');
                if (callback) callback();
            }).getAllData(this.currentActivo);
        },

        buildNav() {
            const nav = $('sidebarNav');
            const level = { 'ADMIN': 4, 'SUPERVISOR': 3, 'SEGURISTA': 2, 'LIDER': 1 }[this.currentUser.rol] || 1;
            const sections = [
                {
                    title: 'Principal', items: [
                        { id: 'dashboard', icon: 'grid', label: 'Dashboard', min: 2 },
                        { id: 'control-desk', icon: 'grid', label: 'Control Desk', min: 2 },
                        { id: 'plan-trabajo', icon: 'grid', label: 'Plan de Trabajo', min: 3 },
                        { id: 'actividades', icon: 'list', label: 'Actividades', min: 3 },
                        { id: 'produccion', icon: 'layers', label: 'Producción', min: 3 },
                    ]
                },
                {
                    title: 'Operación', items: [
                        { id: 'mis-actividades', icon: 'list', label: 'Mi Jornada', min: 1, max: 1 },
                        { id: 'iniciar-jornada', icon: 'play', label: 'Iniciar Jornada', min: 1, max: 1 },
                        { id: 'cierre-jornada', icon: 'stop', label: 'Cierre Jornada', min: 1, max: 1 },
                        { id: 'ast-lider', icon: 'edit', label: 'AST Digital', min: 1, max: 1 },
                    ]
                },
                {
                    title: 'Seguridad', items: [
                        { id: 'inspeccion-herramientas', icon: 'layers', label: 'Inspecciones', min: 2, max: 3 },
                        { id: 'actos-inseguros', icon: 'alert', label: 'Actos Inseguros', min: 2, max: 3 },
                        { id: 'accidentes', icon: 'shield', label: 'Accidentes', min: 2, max: 3 },
                        { id: 'hallazgos', icon: 'alert', label: 'Hallazgos', min: 2 },
                    ]
                },
                {
                    title: 'Administración', items: [
                        { id: 'alta-personal', icon: 'users', label: 'Alta Personal', min: 3 },
                        { id: 'reportes', icon: 'file', label: 'Reportes', min: 3 },
                    ]
                },
                {
                    title: 'Ayuda', items: [
                        { id: 'ayuda', icon: 'file', label: 'Guía', min: 1 },
                    ]
                },
            ];

            nav.innerHTML = sections.filter(s => s.items.some(i => level >= i.min)).map(s => `
                <div class="nav-section"><div class="nav-section-title">${s.title}</div>
                ${s.items.filter(i => level >= i.min && (!i.max || level <= i.max)).map(i => `
                    <div class="nav-item ${this.currentPage === i.id ? 'active' : ''}" onclick="App.navigate('${i.id}')">
                        ${NAV_ICONS[i.icon]} <span>${i.label}</span>
                    </div>
                `).join('')}</div>
            `).join('');
        },

        navigate(page) {
            this.currentPage = page;
            $('topbarTitle').textContent = page.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            this.buildNav();
            if (Pages[page]) Pages[page]();
            else html('pageContent', `<div class="empty-state">Página "${page}" en construcción</div>`);
            if (window.innerWidth < 1024) this.closeSidebar();
        },

        closeSidebar() { $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('active'); },
        logout() { location.reload(); }
    };

    const Pages = {};
</script>
