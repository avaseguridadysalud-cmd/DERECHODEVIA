<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DmV Control v3.0 (LOCAL VERSION)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /* Estilos Core Actualizados */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-input: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --accent-tertiary: #c084fc;
            --accent-success: #4ade80;
            --accent-warning: #fbbf24;
            --accent-danger: #f87171;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --shadow-premium: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-main: 'IBM Plex Sans', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        /* Panel de Configuración Local */
        .config-banner {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .config-banner span {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .config-banner input {
            font-size: 0.8rem;
            padding: 6px 12px;
            width: 280px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: #fff;
            transition: var(--transition);
        }

        /* Login Box Upgrade */
        .login-box {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            margin: -60px auto 0;
            position: relative;
            z-index: 10;
        }



        .pin-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 30px 0;
        }

        .pin-digit {
            width: 56px;
            height: 72px;
            text-align: center;
            font-size: 2rem;
            font-family: var(--font-mono);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            transition: var(--transition);
        }

        .pin-digit:focus {
            border-color: var(--accent-primary);
            outline: none;
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* App Shell */
        #app-shell {
            display: none;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }

        .sidebar-header {
            padding: 32px 24px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), transparent);
        }

        .sidebar-nav {
            padding: 8px 0;
            flex: 1;
        }

        .nav-item {
            padding: 14px 24px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
            font-weight: 500;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: white;
            background: var(--accent-primary);
            box-shadow: var(--shadow-md);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar {
            background: white;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            box-shadow: var(--shadow-sm);
            z-index: 10;
        }

        .page-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        /* Tarjetas de Estadísticas */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-primary);
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        /* Tablas Premium */
        .table-card {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .table-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .premium-table {
            width: 100%;
            border-collapse: collapse;
        }

        .premium-table th {
            background: #f8fafc;
            padding: 16px 24px;
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .premium-table td {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .premium-table tr:last-child td {
            border-bottom: none;
        }

        .premium-table tr:hover td {
            background: #fdfdfd;
        }

        /* Badges */
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #ffedd5;
            color: #9a3412;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background: white;
            padding: 18px 28px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-premium);
            border-left: 6px solid var(--accent-primary);
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px) scale(0.9);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .hidden {
            display: none !important;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Panel de Configuración Local -->
    <div class="config-banner" id="configPanel">
        <span>⚙️ Configuración:</span>
        <input type="text" id="gasUrl" placeholder="URL del Web App (GAS)...">
        <input type="text" id="sheetId" placeholder="ID del Google Sheet (Opcional)...">
        <button class="btn btn-primary" style="width: auto; padding: 6px 15px; font-size: 0.75rem;"
            onclick="saveConfig()">Guardar Ajustes</button>
    </div>

    <div id="loading" class="loading-overlay hidden">
        <div style="text-align: center;">
            <div
                style="width: 40px; height: 40px; border: 3px solid #ddd; border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 1s linear infinite;">
            </div>
            <p style="margin-top: 10px; font-size: 0.9rem; color: var(--text-secondary);">Conectando con el servidor...
            </p>
        </div>
    </div>

    <!-- Pantalla de Login -->
    <div id="screen-login">
        <div class="login-banner">
            <div class="login-banner-content">
                <h1>DmV Control v3.0</h1>
                <p>Versión Local con Base de Datos Remota</p>
            </div>
        </div>
        <div class="login-box">
            <div style="text-align: center; margin-bottom: 20px;">
                <img src="https://lh3.googleusercontent.com/d/1A0myW1PD0JIuutflbCgT_l0YbweG_UO1" alt="GENCO"
                    style="height: 60px;">
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 10px;">Ingrese su PIN de 4 dígitos
                </p>
            </div>
            <div class="pin-container">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" data-pin="0">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" data-pin="1">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" data-pin="2">
                <input type="password" class="pin-digit" maxlength="1" inputmode="numeric" data-pin="3">
            </div>
            <div id="loginError"
                style="color: #c62828; font-size: 0.8rem; text-align: center; margin-bottom: 15px; min-height: 1.2em;">
            </div>
            <button class="btn btn-primary" id="btnLogin">Ingresar</button>
        </div>
    </div>

    <!-- App Shell -->
    <div id="app-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div style="font-weight: 800; font-size: 1.4rem; letter-spacing: -0.05em;">DmV Control <span
                        style="color: var(--accent-primary);">v3</span></div>
                <div style="font-size: 0.75rem; color: #64748b; font-weight: 500; margin-top: 4px;">GENCO • SASISOPA
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav">
                <div class="nav-item active" onclick="navigate('dashboard')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Dashboard
                </div>
                <div class="nav-item" onclick="navigate('actividades')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Actividades
                </div>
                <div class="nav-item" onclick="navigate('alta-personal')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    Alta Personal
                </div>
            </nav>
            <div style="padding: 24px; border-top: 1px solid rgba(255,255,255,0.05);">
                <button class="btn"
                    style="background: rgba(255,255,255,0.05); color: #94a3b8; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1); width: 100%;"
                    onclick="logout()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right: 8px;">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div id="topbarTitle" style="font-weight: 700; font-size: 1.1rem; color: var(--text-primary);">
                        Dashboard</div>
                </div>
                <div id="userInfo"
                    style="display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: 0.9rem; color: var(--text-secondary);">
                </div>
            </header>
            <div class="page-content" id="pageContent"></div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        let CONFIG = {
            url: localStorage.getItem('gas_url') || '',
            sheetId: localStorage.getItem('sheet_id') || '',
            user: null,
            db: {}
        };

        function saveConfig() {
            const urlVal = document.getElementById('gasUrl').value.trim();
            const idVal = document.getElementById('sheetId').value.trim();
            if (urlVal) {
                localStorage.setItem('gas_url', urlVal);
                localStorage.setItem('sheet_id', idVal);
                toast("Configuración guardada.");
                setTimeout(() => location.reload(), 800);
            } else {
                toast("La URL del Web App es necesaria", "error");
            }
        }

        window.onload = () => {
            if (CONFIG.url) document.getElementById('gasUrl').value = CONFIG.url;
            if (CONFIG.sheetId) document.getElementById('sheetId').value = CONFIG.sheetId;
            App.init();
        };

        async function gasCall(functionName, payload) {
            if (!CONFIG.url) {
                toast("Error: No se ha configurado la URL", "error");
                return { success: false, error: "URL no configurada" };
            }
            document.getElementById('loading').classList.remove('hidden');

            return new Promise((resolve) => {
                const cb = 'callback_' + Math.round(Math.random() * 1000000);
                const url = `${CONFIG.url}?action=${functionName}&payload=${encodeURIComponent(JSON.stringify(payload))}&spreadsheetId=${CONFIG.sheetId}&callback=${cb}`;

                window[cb] = (data) => {
                    delete window[cb];
                    document.getElementById('loading').classList.add('hidden');
                    resolve(data);
                };

                const script = document.createElement('script');
                script.src = url;
                script.onerror = () => {
                    document.getElementById('loading').classList.add('hidden');
                    toast("Error de conexión remota", "error");
                    resolve({ success: false, error: "Error de red" });
                };
                document.body.appendChild(script);
            });
        }

        const App = {
            init() {
                this.setupPinInputs();
                document.getElementById('btnLogin').onclick = () => this.attemptLogin();
            },
            setupPinInputs() {
                const pins = document.querySelectorAll('.pin-digit');
                pins.forEach((input, i) => {
                    input.addEventListener('input', () => {
                        if (input.value && i < 3) pins[i + 1].focus();
                        if (i === 3 && input.value) this.attemptLogin();
                    });
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Backspace' && !input.value && i > 0) pins[i - 1].focus();
                    });
                });
            },
            async attemptLogin() {
                const pin = Array.from(document.querySelectorAll('.pin-digit')).map(i => i.value).join('');
                if (pin.length < 4) return;

                console.log('Attempting login with PIN:', pin);
                toast('Verificando PIN...', 'info');

                const btn = document.getElementById('btnLogin');
                btn.disabled = true;
                const res = await gasCall('login', pin);

                console.log('Login result:', res);

                if (res && res.success) {
                    CONFIG.user = res.usuario;
                    this.enterApp();
                } else {
                    btn.disabled = false;
                    document.getElementById('loginError').innerText = res.error || "Acceso Denegado";
                    toast(res.error || "Error de autenticación", "error");
                }
            },
            enterApp() {
                document.getElementById('screen-login').classList.add('hidden');
                document.getElementById('configPanel').classList.add('hidden');
                document.getElementById('app-shell').style.display = 'flex';
                document.getElementById('userInfo').innerHTML = `
                    <span style="background: var(--accent-tertiary); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; color: var(--accent-primary);">
                        ${CONFIG.user.rol}
                    </span>
                    <span>${CONFIG.user.nombre}</span>
                `;
                this.renderSidebar();
                this.refreshData();
                this.navigate('dashboard');
            },
            renderSidebar() {
                const rol = CONFIG.user.rol;
                const nav = document.getElementById('sidebarNav');
                let html = `
                    <div class="nav-item" onclick="navigate('dashboard')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        Dashboard
                    </div>
                `;

                if (rol === 'ADMIN' || rol === 'SUPERVISOR') {
                    html += `
                        <div class="nav-item" onclick="navigate('actividades')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            Actividades
                        </div>
                        <div class="nav-item" onclick="navigate('alta-personal')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle></svg>
                            Alta Personal
                        </div>
                    `;
                }

                if (rol === 'LIDER' || rol === 'ADMIN') {
                    html += `
                        <div class="nav-item" onclick="navigate('iniciar-jornada')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"></path></svg>
                            Iniciar Jornada
                        </div>
                        <div class="nav-item" onclick="navigate('cierre-jornada')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>
                            Cierre Jornada
                        </div>
                    `;
                }

                if (rol === 'SEGURISTA' || rol === 'ADMIN' || rol === 'SUPERVISOR') {
                    html += `
                        <div class="nav-item" onclick="navigate('patrullaje')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                            Patrullaje
                        </div>
                        <div class="nav-item" onclick="navigate('hallazgos')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            Hallazgos
                        </div>
                        <div class="nav-item" onclick="navigate('inspeccion-herramientas')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                            Inspecciones
                        </div>
                        <div class="nav-item" onclick="navigate('actos-inseguros')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            Actos Inseguros
                        </div>
                        <div class="nav-item" onclick="navigate('accidentes')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                            Accidentes
                        </div>
                    `;
                }

                nav.innerHTML = html;
            },
            async refreshData() {
                const data = await gasCall('getAllData', 'TODOS');
                if (data) {
                    CONFIG.db = data;
                    if (this.currentPage) this.navigate(this.currentPage);
                }
            },
            navigate(page) {
                this.currentPage = page;
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.getAttribute('onclick').includes(page)) item.classList.add('active');
                });

                const methods = {
                    'dashboard': () => this.renderDashboard(),
                    'actividades': () => this.renderActividades(),
                    'alta-personal': () => this.renderAltaPersonal(),
                    'iniciar-jornada': () => this.renderIniciarJornada(),
                    'cierre-jornada': () => this.renderCierreJornada(),
                    'inspeccion-herramientas': () => this.renderInspeccion(),
                    'actos-inseguros': () => this.renderActosInseguros(),
                    'patrullaje': () => this.renderPatrullaje(),
                    'hallazgos': () => this.renderHallazgos(),
                    'accidentes': () => this.renderAccidentes()
                };

                if (methods[page]) methods[page]();
                else this.renderDashboard();
            },

            renderDashboard() {
                const db = CONFIG.db;
                document.getElementById('topbarTitle').innerText = "Panel Principal";
                document.getElementById('pageContent').innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon" style="background: #eff6ff; color: #2563eb;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                            </div>
                            <div>
                                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Actividades</span>
                                <h2 style="font-size: 1.75rem; font-weight: 700;">${db.actividades?.length || 0}</h2>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon" style="background: #f0fdf4; color: #10b981;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                            </div>
                            <div>
                                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Personal</span>
                                <h2 style="font-size: 1.75rem; font-weight: 700;">${db.usuarios?.length || 0}</h2>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon" style="background: #fff7ed; color: #f59e0b;">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
                            </div>
                            <div>
                                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Hallazgos</span>
                                <h2 style="font-size: 1.75rem; font-weight: 700;">${db.hallazgos?.length || 0}</h2>
                            </div>
                        </div>
                    </div>

                    <div class="table-card">
                        <div class="table-header">
                            <h3 style="font-weight: 700;">Mis Actividades Recientes</h3>
                            <button class="btn btn-primary" style="padding: 8px 16px; font-size: 0.8rem;" onclick="App.refreshData()">🔄 Actualizar</button>
                        </div>
                        <table class="premium-table">
                            <thead><tr><th>ID</th><th>Trabajo</th><th>Tramo</th><th>Estado</th></tr></thead>
                            <tbody>
                                ${(db.actividades || []).filter(a => a.lider === CONFIG.user.id || CONFIG.user.rol === 'ADMIN').slice(0, 5).map(a => `
                                    <tr>
                                        <td style="font-weight: 600;">${a.ID}</td>
                                        <td>${a.Tipo}</td>
                                        <td>${a.Tramo || '---'}</td>
                                        <td><span class="badge ${a.Estado === 'En Curso' ? 'badge-success' : 'badge-warning'}">${a.Estado}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            },

            renderIniciarJornada() {
                const acts = (CONFIG.db.actividades || []).filter(a => a.estado !== 'Completada');
                document.getElementById('topbarTitle').innerText = "Inicio de Jornada";
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-box" style="margin:0 auto; max-width: 500px;">
                        <h2 style="margin-bottom:20px; text-align:center;">▶ Iniciar Actividad</h2>
                        <div class="form-group">
                            <label>Seleccione Actividad</label>
                            <select id="ij-act" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;">
                                ${acts.map(a => `<option value="${a.ID}">${a.ID} - ${a.Tipo}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Foto de Inicio</label>
                            <input type="file" id="ij-foto" class="pin-digit" style="width:100%; height:48px; padding:10px;" accept="image/*">
                        </div>
                        <button class="btn btn-primary" onclick="App.submitInicio()" style="width:100%;">🚀 Iniciar ahora</button>
                    </div>
                `;
            },

            async submitInicio() {
                const id = document.getElementById('ij-act').value;
                const btn = event.target;
                btn.disabled = true; btn.innerText = "⏳ Iniciando...";

                const res = await gasCall('iniciarActividad', { id, userId: CONFIG.user.id });
                if (res.success) {
                    toast("✅ Jornada iniciada correctamente");
                    this.refreshData();
                    this.navigate('dashboard');
                } else {
                    toast("❌ " + res.error, "error");
                    btn.disabled = false; btn.innerText = "🚀 Iniciar ahora";
                }
            },

            renderCierreJornada() {
                const acts = (CONFIG.db.actividades || []).filter(a => a.Estado === 'En Curso');
                document.getElementById('topbarTitle').innerText = "Cierre de Jornada";
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-box" style="margin:0 auto; max-width: 500px;">
                        <h2 style="margin-bottom:20px; text-align:center;">🏁 Finalizar Trabajo</h2>
                        <div class="form-group">
                            <label>Actividad a Cerrar</label>
                            <select id="cj-act" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;">
                                ${acts.map(a => `<option value="${a.ID}">${a.ID} - ${a.Tipo}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Observaciones / Pendientes</label>
                            <textarea id="cj-obs" class="pin-digit" style="width:100%; height:80px; text-align:left; padding:10px;"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="App.submitCierre()" style="width:100%;">✓ Reportar Cierre</button>
                    </div>
                `;
            },

            async submitCierre() {
                const id = document.getElementById('cj-act').value;
                const obs = document.getElementById('cj-obs').value;
                const res = await gasCall('completarActividad', { id, userId: CONFIG.user.id, observaciones: obs });
                if (res.success) {
                    toast("✅ Actividad completada y reportada");
                    this.refreshData();
                    this.navigate('dashboard');
                } else {
                    toast("❌ Error al cerrar", "error");
                }
            },

            renderActividades() {
                const acts = CONFIG.db.actividades || [];
                document.getElementById('topbarTitle').innerText = "Listado de Actividades";
                document.getElementById('pageContent').innerHTML = `
                    <div class="table-card">
                        <table class="premium-table">
                            <thead><tr><th>Folio</th><th>Tipo</th><th>Líder</th><th>Estado</th></tr></thead>
                            <tbody>
                                ${acts.map(a => `
                                    <tr>
                                        <td>${a.ID}</td>
                                        <td>${a.Tipo}</td>
                                        <td>${a.Lider || '---'}</td>
                                        <td><span class="badge ${a.Estado === 'Completada' ? 'badge-success' : 'badge-warning'}">${a.Estado}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            },

            renderAltaPersonal() {
                document.getElementById('topbarTitle').innerText = "Alta de Personal";
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-box" style="margin:0 auto; max-width: 450px;">
                        <h2 style="text-align:center; color: var(--accent-primary); margin-bottom:20px;">👤 Nuevo Usuario</h2>
                        <input type="text" id="reg-nombre" placeholder="Nombre completo" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px; margin-bottom:15px;">
                        <input type="number" id="reg-pin" placeholder="PIN (4 dígitos)" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px; margin-bottom:15px;">
                        <select id="reg-rol" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px; margin-bottom:20px;">
                            <option value="LIDER">LIDER DE CUADRILLA</option>
                            <option value="SEGURISTA">SEGURISTA</option>
                            <option value="SUPERVISOR">SUPERVISOR</option>
                            <option value="ADMIN">ADMINISTRADOR</option>
                        </select>
                        <button class="btn btn-primary" onclick="App.submitAltaPersonal()" style="width:100%;">🚀 Registrar</button>
                    </div>
                `;
            },

            async submitAltaPersonal() {
                const nombre = document.getElementById('reg-nombre').value.trim();
                const pin = document.getElementById('reg-pin').value.trim();
                const rol = document.getElementById('reg-rol').value;

                if (!nombre || pin.length !== 4) return toast("❌ Datos incompletos", "error");

                const btn = event.target;
                btn.disabled = true; btn.innerText = "⏳ Guardando...";

                const res = await gasCall('registrarUsuarioApp', { nombre, pin, rol, adminId: CONFIG.user.id });
                if (res.success) {
                    toast("✅ Usuario registrado");
                    this.refreshData();
                    this.navigate('alta-personal');
                } else {
                    toast("❌ Error: " + res.error, "error");
                    btn.disabled = false; btn.innerText = "🚀 Registrar";
                }
            },

            renderInspeccion() {
                document.getElementById('topbarTitle').innerText = "Inspección de Herramientas";
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-box" style="margin:0 auto; max-width: 500px;">
                        <h2 style="margin-bottom:20px; text-align:center;">🔧 Nueva Inspección</h2>
                        <div class="form-group">
                            <label>Estado Herramientas</label>
                            <select id="ins-estado" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;">
                                <option value="Bueno">Bueno / Operativo</option>
                                <option value="Regular">Regular / Con detalles</option>
                                <option value="Malo">Malo / Retirar</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Descripción / Observación</label>
                            <textarea id="ins-desc" class="pin-digit" style="width:100%; height:80px; padding:10px;"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="App.submitInspeccion()" style="width:100%;">💾 Guardar Inspección</button>
                    </div>
                `;
            },

            async submitInspeccion() {
                const estado = document.getElementById('ins-estado').value;
                const desc = document.getElementById('ins-desc').value;
                const res = await gasCall('guardarInspeccionHerramienta', { estado, descripcion: desc, userId: CONFIG.user.id });
                if (res.success) {
                    toast("✅ Inspección guardada");
                    this.navigate('dashboard');
                } else {
                    toast("❌ Error al guardar", "error");
                }
            },

            renderActosInseguros() {
                const usuarios = CONFIG.db.usuarios || [];
                document.getElementById('topbarTitle').innerText = "Registro de Actos Inseguros";
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-box" style="margin:0 auto; max-width: 500px;">
                        <h2 style="margin-bottom:20px; text-align:center; color: var(--accent-danger);">⚠️ Nuevo Reporte</h2>
                        <div class="form-group">
                            <label>Persona Involucrada</label>
                            <select id="acto-user" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;">
                                ${usuarios.map(u => `<option value="${u.id}">${u.nombre}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tipo de Acto</label>
                            <select id="acto-tipo" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;">
                                <option value="Falta EPP">Falta EPP</option>
                                <option value="Herramienta Inadecuada">Herramienta Inadecuada</option>
                                <option value="Zona Peligrosa">Zona Peligrosa</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Evidencia / Detalle</label>
                            <textarea id="acto-desc" class="pin-digit" style="width:100%; height:80px; padding:10px;"></textarea>
                        </div>
                        <button class="btn btn-danger" onclick="App.submitActo()" style="width:100%;">⚠️ Registrar Amonestación</button>
                    </div>
                `;
            },

            async submitActo() {
                const payload = {
                    userIdInvolucrado: document.getElementById('acto-user').value,
                    tipo: document.getElementById('acto-tipo').value,
                    descripcion: document.getElementById('acto-desc').value,
                    reportaId: CONFIG.user.id
                };
                const res = await gasCall('registrarAmonestacion', payload);
                if (res.success) {
                    toast("⚠️ Reporte enviado correctamente");
                    this.navigate('dashboard');
                } else {
                    toast("❌ Error al enviar reporte", "error");
                }
            },

            renderPatrullaje() {
                document.getElementById('topbarTitle').innerText = "Nuevo Patrullaje";
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-box" style="margin:0 auto; max-width: 500px;">
                        <h2 style="margin-bottom:20px; text-align:center;">🛣️ Registro de Ruta</h2>
                        <div class="form-group">
                            <label>Ubicación / Tramo</label>
                            <input type="text" id="pat-loc" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;" placeholder="Km 45+200">
                        </div>
                        <div class="form-group">
                            <label>Tipo de Hallazgo</label>
                            <select id="pat-tipo" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;">
                                <option value="Bache">Bache / Daño Carpeta</option>
                                <option value="Basura">Basura / Maleza</option>
                                <option value="Senal">Señalamiento Dañado</option>
                                <option value="Accidente">Accidente Vial</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Detalle</label>
                            <textarea id="pat-desc" class="pin-digit" style="width:100%; height:80px; padding:10px;"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="App.submitPatrullaje()" style="width:100%;">🚀 Reportar Patrullaje</button>
                    </div>
                `;
            },

            async submitPatrullaje() {
                const payload = {
                    ubicacion: document.getElementById('pat-loc').value,
                    tipo: document.getElementById('pat-tipo').value,
                    descripcion: document.getElementById('pat-desc').value,
                    userId: CONFIG.user.id
                };
                const res = await gasCall('registrarPatrullaje', payload);
                if (res.success) {
                    toast("✅ Patrullaje registrado");
                    this.navigate('dashboard');
                } else {
                    toast("❌ Error al reportar", "error");
                }
            },

            renderHallazgos() {
                const hallazgos = CONFIG.db.hallazgos || [];
                document.getElementById('topbarTitle').innerText = "Seguimiento de Hallazgos";
                document.getElementById('pageContent').innerHTML = `
                    <div class="table-card">
                        <table class="premium-table">
                            <thead><tr><th>ID</th><th>Tipo</th><th>Estatus</th><th>Fecha</th></tr></thead>
                            <tbody>
                                ${hallazgos.map(h => `
                                    <tr>
                                        <td style="font-weight: 600;">${h.id || h.ID}</td>
                                        <td>${h.tipo || h.Tipo}</td>
                                        <td><span class="badge ${h.estado === 'Cerrado' ? 'badge-success' : 'badge-warning'}">${h.estado || h.Estado}</span></td>
                                        <td>${h.fecha || '---'}</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="4" style="text-align:center; padding:20px;">No hay hallazgos registrados</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            },

            renderAccidentes() {
                document.getElementById('topbarTitle').innerText = "Reporte de Emergencia / Accidentes";
                document.getElementById('pageContent').innerHTML = `
                    <div class="login-box" style="margin:0 auto; max-width: 500px; border: 2px solid var(--accent-danger);">
                        <h2 style="margin-bottom:20px; text-align:center; color: var(--accent-danger);">🚨 Reportar Evento</h2>
                        <div class="alert-strip" style="background: #fef2f2; border-left: 4px solid var(--accent-danger); padding: 12px; margin-bottom: 20px; color: #991b1b; font-size: 0.85rem;">
                            <strong>¡ATENCIÓN!</strong> Priorice la seguridad del personal y primeros auxilios antes de reportar.
                        </div>
                        <div class="form-group">
                            <label>Tipo de Evento</label>
                            <select id="acc-tipo" class="pin-digit" style="width:100%; height:48px; text-align:left; padding:0 15px;">
                                <option value="Accidente">Accidente con Lesión</option>
                                <option value="Incidente">Incidente (Sin Lesión)</option>
                                <option value="Danios">Daños Materiales / Vehicular</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Descripción de los hechos</label>
                            <textarea id="acc-desc" class="pin-digit" style="width:100%; height:100px; padding:10px;" placeholder="Relate lo sucedido con detalle..."></textarea>
                        </div>
                        <button class="btn btn-danger" onclick="App.submitAccidente()" style="width:100%;">🚑 Enviar Reporte Crítico</button>
                    </div>
                `;
            },

            async submitAccidente() {
                const payload = {
                    tipo: document.getElementById('acc-tipo').value,
                    descripcion: document.getElementById('acc-desc').value,
                    userId: CONFIG.user.id
                };
                if (!payload.descripcion) return toast("⚠️ Ingrese una descripción", "error");
                const res = await gasCall('crearIncidente', payload);
                if (res.success) {
                    toast("🚨 Reporte enviado. Los supervisores han sido notificados.");
                    this.navigate('dashboard');
                } else {
                    toast("❌ Error al enviar reporte", "error");
                }
            }
        };

        function toast(m, t = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${t}`;
            el.innerHTML = `<span>${m}</span>`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                setTimeout(() => el.remove(), 400);
            }, 4000);
        }

        function navigate(p) { App.navigate(p); }
        function logout() { location.reload(); }
    </script>
</body>

</html>
