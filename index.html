<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DmV Control v3.0 | SGO Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Palette: Slate & Blue & Emerald */
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-glass: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);

            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;

            /* Brand Colors */
            --brand-primary: #3b82f6;
            /* Blue 500 */
            --brand-hover: #2563eb;
            /* Blue 600 */
            --brand-glow: rgba(59, 130, 246, 0.5);

            /* Status Colors */
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;

            /* UI Tokens */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 15px var(--brand-glow);

            --font-main: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* --- Layout --- */
        #app-shell {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 80% 10%, #1e293b 0%, #0f172a 60%);
            overflow: hidden;
        }

        .topbar {
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .topbar-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .network-status {
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .network-status.online {
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .network-status.offline {
            color: var(--text-tertiary);
            background: rgba(148, 163, 184, 0.1);
        }

        .content {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* --- Typography & Cards --- */
        h1,
        h2,
        h3,
        h4 {
            margin: 0;
            font-weight: 600;
            color: var(--text-primary);
        }

        h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .card {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease-out;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* --- Forms --- */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        /* --- Buttons --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 8px;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-block {
            width: 100%;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: var(--brand-primary);
            color: white;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: var(--brand-hover);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
            color: #fecaca;
        }

        /* --- Badges & Status --- */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-orange {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .badge-gray {
            background: rgba(148, 163, 184, 0.15);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        /* --- Login Screen --- */
        .screen-full {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2670&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .screen-full::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
        }

        .glass-box {
            position: relative;
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .pin-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 30px 0;
        }

        .pin-digit {
            width: 100%;
            height: 64px;
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-size: 24px;
            text-align: center;
            transition: all 0.2s;
        }

        .pin-digit:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
            transform: translateY(-2px);
        }

        /* --- Stats Grid --- */
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        /* --- Tables --- */
        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .table th {
            background: rgba(255, 255, 255, 0.03);
            text-align: left;
            padding: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }

        .table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        /* --- Mobile Navigation --- */
        .nav-item {
            padding: 12px 16px;
            margin: 4px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: var(--brand-primary);
            font-weight: 600;
        }

        /* --- Alert Strips --- */
        .alert-strip {
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 0.9rem;
            border-left: 4px solid;
            background: rgba(255, 255, 255, 0.02);
        }

        .alert-strip.text-blue {
            border-color: var(--info);
            color: #bae6fd;
            background: rgba(14, 165, 233, 0.1);
        }

        .alert-strip.text-red {
            border-color: var(--danger);
            color: #fecaca;
            background: rgba(239, 68, 68, 0.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <script>
        // CONFIGURACIÓN HEADLESS - ACTUALIZADA POR EL USUARIO
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyVP0gTvGDD35uKVUGKdAG3RufPW6ea1OmErCyU-bcRQxXynU-Mm0a6co8NX7b03TwpbA/exec';
        const SPREADSHEET_ID = '14dnLZDpVTiBePINCT0sUefubzeJVryppqt-rTTYuUp0';
    </script>

    <div id="screen-login" class="screen-full">
        <div class="glass-box" style="text-align:center">
            <h1 style="margin-bottom:8px">SGO DMV v3.0</h1>
            <p style="color:var(--text-dim); font-size:0.9rem">Gestión de Derecho de Vía · GENCO</p>
            <div class="pin-grid">
                <input type="password" maxlength="1" class="pin-digit" inputmode="numeric">
                <input type="password" maxlength="1" class="pin-digit" inputmode="numeric">
                <input type="password" maxlength="1" class="pin-digit" inputmode="numeric">
                <input type="password" maxlength="1" class="pin-digit" inputmode="numeric">
            </div>
            <button class="btn btn-primary btn-block" id="btnLogin">INGRESAR</button>
            <div id="loginError" style="color:var(--danger); font-size:0.8rem; margin-top:10px"></div>
        </div>
    </div>

    <div id="app-shell" class="hidden">
        <aside class="sidebar" id="sidebar">
            <div style="padding:24px; border-bottom:1px solid var(--border-color)">
                <h2 style="color:var(--accent)">DmV <span style="font-weight:300; color:#fff">Control</span></h2>
                <div id="folioPrefix" style="font-size:0.65rem; color:var(--text-dim); margin-top:4px">GC-OP-DMV-000
                </div>
            </div>
            <nav id="sidebarNav" style="flex:1; padding:10px 0; overflow-y:auto"></nav>
            <div style="padding:20px; border-top:1px solid var(--border-color)">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px">
                    <div id="userAvatar"
                        style="width:40px; height:40px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700">
                        --</div>
                    <div>
                        <div id="userName" style="font-weight:700; font-size:0.9rem">--</div>
                        <div id="userRole" style="font-size:0.7rem; color:var(--accent)">ADMIN</div>
                    </div>
                </div>
                <button class="btn btn-danger btn-block" onclick="location.reload()">CERRAR SESIÓN</button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button onclick="document.getElementById('sidebar').classList.toggle('open')"
                    style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer">☰</button>
                <img id="headerLogo" style="height:32px; margin:0 12px; display:none; border-radius:4px" alt="Logo">
                <h3 id="topbarTitle">Dashboard</h3>
                <div id="topbarDate" style="font-size:0.8rem; color:var(--text-dim)"></div>
            </header>
            <div class="content" id="pageContent"></div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div id="modal-overlay">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <script>
        /* ================================================================
           SEED DATA & FULL CATALOGS (from index_FINAL.txt)
           ================================================================ */
        const DB = {
            usuarios: [], tramos: [], actividades: [], personalCampo: [], planTrabajo: [], hallazgos: [], ast: [], incidentes: [],
            sasisopa: [
                { id: 'S01', elemento: 'Política de seguridad' }, { id: 'S02', elemento: 'Identificación de peligros' },
                { id: 'S03', elemento: 'Marco normativo' }, { id: 'S04', elemento: 'Competencia del personal' },
                { id: 'S07', elemento: 'Procedimientos operativos' }, { id: 'S09', elemento: 'Respuesta a emergencias' },
                { id: 'S10', elemento: 'Monitoreo y evaluación' }, { id: 'S12', elemento: 'Investigación incidentes' },
                { id: 'S14', elemento: 'Información y documentación' }
            ],
            nomMatriz: [
                { id: 'N1', nom: 'NOM-020-ASEA-2016', titulo: 'Transporte de gas por ducto (DmV)' },
                { id: 'N2', nom: 'NOM-017-STPS-2008', titulo: 'Equipo de Protección Personal' },
                { id: 'N3', nom: 'NOM-030-STPS-2009', titulo: 'Servicios de Salud Preventivos' }
            ],
            eppCatalogo: {
                'Supervisor': ['Casco blanco', 'Lentes de seguridad', 'Botas dieléctricas', 'Chaleco alta visibilidad', 'Radio'],
                'Lider': ['Casco naranja', 'Lentes', 'Guantes de carnaza', 'Botas de seguridad', 'Chaleco'],
                'Ayudante': ['Casco amarillo', 'Lentes', 'Guantes de hule/carnaza', 'Botas', 'Chaleco'],
                'Segurista': ['Casco azul', 'Lentes', 'Detector de gas', 'Botiquín', 'Chaleco r-reflectante']
            },
            indicadores: { pctAvance: 0, kmEjec: 0, hallAbiertos: 0, actEnCurso: 0, foliosHoy: 0 }
        };

        const App = {
            user: null, page: 'dashboard',
            init() {
                this.loadLogo();
                this.setupPin();
                document.getElementById('btnLogin').onclick = () => this.login();
                document.getElementById('topbarDate').innerText = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
            },
            setupPin() {
                const pins = document.querySelectorAll('.pin-digit');
                pins.forEach((p, i) => {
                    p.oninput = () => { if (p.value && i < 3) pins[i + 1].focus(); if (i === 3) this.login(); };
                    p.onkeydown = (e) => { if (e.key === 'Backspace' && !p.value && i > 0) pins[i - 1].focus(); };
                });
            },
            async loadLogo() {
                try {
                    // Intenta cargar logo desde backend (getImgBase64)
                    const res = await this.api('getAppLogo');
                    if (res && res.success && res.image) {
                        const img = document.getElementById('headerLogo');
                        img.src = res.image;
                        img.style.display = 'block';
                    }
                } catch (e) { console.warn('Error loading logo', e); }
            },
            async api(action, payload = {}) {
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, payload, spreadsheetId: SPREADSHEET_ID })
                    });
                    const res = await response.json();
                    if (res.success === false) { this.toast(res.error || 'Error del servidor', 'danger'); return res; }
                    return res;
                } catch (e) {
                    console.warn('Conexión Offline - Usando emulación local (Demo Mode)');
                    return this.localEngine(action, payload);
                }
            },
            localEngine(action, p) {
                // Emula el backend si falla la conexión
                if (action === 'login') return { success: true, usuario: { id: 'U01', nombre: 'Administrador Principal', rol: 'ADMIN' } };
                if (action === 'getAllData') return { success: true, data: { indicadores: { pctAvance: 65, kmEjec: 142.8, hallAbiertos: 4, actEnCurso: 2, foliosHoy: 12 } } };
                return { success: true, id: 'DMO-' + Date.now() };
            },
            toast(msg, type = 'info') {
                const c = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = `toast ${type === 'danger' ? 'danger' : ''}`;
                t.innerText = msg;
                c.appendChild(t);
                setTimeout(() => t.remove(), 3500);
            },
            async uploadPhoto(fileInputId, maxSizePx = 1024) {
                const input = document.getElementById(fileInputId);
                if (!input || !input.files || input.files.length === 0) return null;
                const file = input.files[0];

                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > maxSizePx) { height *= maxSizePx / width; width = maxSizePx; }
                            } else {
                                if (height > maxSizePx) { width *= maxSizePx / height; height = maxSizePx; }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // Compress to 70% quality

                            this.toast('Subiendo foto...', 'info');
                            // Upload to Backend
                            this.api('saveImageToDrive', { base64Data: dataUrl }).then(res => {
                                if (res.success) resolve(res.id);
                                else { this.toast('Error subiendo foto', 'danger'); resolve(null); }
                            }).catch(err => { this.toast('Error de red', 'danger'); resolve(null); });
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            },
            async login() {
                const pin = Array.from(document.querySelectorAll('.pin-digit')).map(i => i.value).join('');
                if (pin.length < 4) return;

                console.log('Attempting login with PIN:', pin);
                this.toast('Verificando PIN...', 'info');

                const res = await this.api('login', pin);
                console.log('Login result:', res);

                if (res.success) {
                    this.user = res.usuario;
                    document.getElementById('screen-login').classList.add('hidden');
                    document.getElementById('app-shell').classList.remove('hidden');
                    document.getElementById('userName').innerText = this.user.nombre;
                    document.getElementById('userRole').innerText = this.user.rol;
                    document.getElementById('userAvatar').innerText = this.user.nombre.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    this.refreshData();
                } else {
                    document.getElementById('loginError').innerText = res.error || 'PIN incorrecto';
                    this.toast('Error: ' + (res.error || 'PIN incorrecto'), 'danger');
                    document.querySelectorAll('.pin-digit').forEach(i => i.value = '');
                    document.querySelectorAll('.pin-digit')[0].focus();
                }
            },
            async refreshData() {
                const res = await this.api('getAllData', 'TODOS');
                if (res.success && res.data) { Object.assign(DB, res.data); }
                this.renderNav();
                this.navigate('dashboard');
            },
            renderNav() {
                const nav = document.getElementById('sidebarNav');
                const menu = [
                    { id: 'dashboard', label: '📊 Dashboard Operativo', roles: ['ADMIN', 'SUPERVISOR'] },
                    { id: 'plan-trabajo', label: '📅 Plan de Trabajo', roles: ['ADMIN', 'SUPERVISOR'] },
                    { id: 'mis-actividades', label: '🚚 Mi Jornada', roles: ['LIDER', 'ADMIN'] },
                    { id: 'seguridad-hse', label: '🛡️ Seguridad & SASISOPA', roles: ['ADMIN', 'SEGURISTA', 'SUPERVISOR'] },
                    { id: 'gestion-epp', label: '🦺 Gestión EPP', roles: ['ADMIN', 'SEGURISTA'] },

            renderNOMChecklist(nom) {
                const checklists = {
                    'NOM-030': [

                        { id: '30-2', q: '¿Se cuenta con un programa de seguridad y salud en el trabajo?' },

                    ],

                        { id: '17-2', q: '¿Se determina el EPP necesario para cada puesto?' },
                        { id: '17-3', q: '¿Se proporciona el EPP a los trabajadores?' },
                        { id: '17-4', q: '¿Se revisa que el EPP se utilice correctamente?' }
                    ]
                };

                const questions = checklists[nom] || [];

                document.getElementById('nom-content').innerHTML = `
                    <h4 style="color:var(--accent); margin-bottom:15px">${nom} - Lista de Verificación</h4>
                    ${questions.map(q => `
                        <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:6px; margin-bottom:10px">
                            <div style="margin-bottom:8px; font-weight:500">${q.q}</div>

                                </label>
                                <label class="badge badge-orange" style="cursor:pointer; flex:1; text-align:center">
                                    <input type="radio" name="${q.id}" value="PARCIAL" class="nom-check"> PARCIAL
                                </label>
                                <label class="badge badge-red" style="cursor:pointer; flex:1; text-align:center">
                                    <input type="radio" name="${q.id}" value="NO_CUMPLE" class="nom-check"> NO CUMPLE
                                </label>
                            </div>
                        </div>
                    `).join('')}
                    <button class="btn btn-primary btn-block" onclick="Pages.submitNOM('${nom}')" style="margin-top:20px">GUARDAR EVALUACIÓN</button>
                `;
            },

            async submitNOM(nom) {
                const checks = [];
                let answered = 0;
                let total = 0;

                // Get all radio groups names
                const groupNames = new Set(Array.from(document.querySelectorAll('.nom-check')).map(r => r.name));
                total = groupNames.size;

                groupNames.forEach(name => {
                    const val = document.querySelector(`input[name="${name}"]:checked`)?.value;
                    if (val) {
                        checks.push({ id: name, result: val });
                        answered++;
                    }
                });

                if (answered < total) return App.toast('Responda todas las preguntas', 'error');

                App.toast('Guardando evaluación...', 'info');
                const res = await App.api('registrarChecklistNOM', {
                    nom: nom,
                    resultados: checks,
                    userId: App.user.id
                });

                if (res.success) {
                    App.toast('Evaluación NOM Registrada', 'success');
                    Pages['seguridad-hse']();
                }
            },

            async submitASTMulti() {
                const actId = document.getElementById('astActividad').value;
                if (!actId) return App.toast('Seleccione una actividad', 'error');

                const peligros = [], riesgos = [], controles = [];
                for (let i = 1; i <= this.astRowCount; i++) {
                    const p = document.getElementById('plg' + i)?.value;
                    if (p) {
                        peligros.push(p);
                        riesgos.push(document.getElementById('rsg' + i).value);
                        controles.push(document.getElementById('ctl' + i).value);
                    }
                }

                if (peligros.length === 0) return App.toast('Registre al menos un peligro y control', 'error');

                const firmas = Array.from(document.querySelectorAll('.ast-firma:checked')).map(c => c.value);

                const payload = {
                    actividadId: actId,
                    userId: App.user.id,
                    peligros: peligros,
                    riesgos: riesgos,
                    controles: controles,
                    firmas: firmas
                };

                App.toast('Enviando AST...', 'info');
                const res = await App.api('saveASTMultifactorial', payload);
                if (res.success) {
                    App.toast('AST Firmado y Aprobado. Folio: ' + res.id, 'success');
                    if (confirm('¿Desea descargar el PDF del AST ahora?')) {
                        Pages.generarPDF(res.id, 'AST');

                    App.refreshData();
                    App.navigate('dashboard');

            b64toBlob(b64Data, contentType) {
                const sliceSize = 512;
                const byteCharacters = atob(b64Data);
                const byteArrays = [];
                for (let offset = 0; offset < byteCharacters.length; offset += sliceSize) {
                    const slice = byteCharacters.slice(offset, offset + sliceSize);
                    const byteNumbers = new Array(slice.length);
                    for (let i = 0; i < slice.length; i++) byteNumbers[i] = slice.charCodeAt(i);
                    const byteArray = new Uint8Array(byteNumbers);
                    byteArrays.push(byteArray);
                }
                return new Blob(byteArrays, { type: contentType });
            },
            renderLogAmbiental() {
                document.getElementById('pa-content').innerHTML = `
                    <h4 style="margin-bottom:15px">Registro de Residuos Peligrosos / Manejo Especial</h4>
                    <div class="form-group"><label class="form-label">Clasificación</label>
                         <select class="form-select" id="ambTipo"><option value="RP">Residuo Peligroso (RP)</option><option value="RME">Residuo de Manejo Especial (RME)</option><option value="RSU">Residuo Sólido Urbano</option></select>
                    </div>
                    <div class="form-group"><label class="form-label">Descripción del Residuo</label>
                        <input type="text" class="form-input" id="ambDesc" placeholder="Ej. Estopa con aceite, Llantas, PET">
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                        <div class="form-group"><label class="form-label">Cantidad</label>
                            <input type="number" class="form-input" id="ambCant">
                        </div>
                        <div class="form-group"><label class="form-label">Unidad</label>
                              <select class="form-select" id="ambUnidad"><option>kg</option><option>lt</option><option>m3</option><option>pzas</option></select>
                        </div>
                    </div>
                    <div class="form-group"><label class="form-label">Disposición</label>
                         <select class="form-select" id="ambDisp"><option>Almacén Temporal</option><option>Recolección Autorizada</option><option>Disposición Final</option></select>
                    </div>
                     <div class="form-group"><label class="form-label">Folio Manifiesto (Si aplica)</label>
                        <input type="text" class="form-input" id="ambManif" placeholder="Opcional">
                    </div>
                    <div style="margin-bottom:20px">
                        <label class="form-label">Evidencia del Residuo (Opcional)</label>
                        <input type="file" id="ambFoto" accept="image/*" capture="environment" class="form-input">
                    </div>
                    <button class="btn btn-success btn-block" onclick="Pages.submitAmbiental()">REGISTRAR EN BITÁCORA</button>
                `;
            },
            async submitPermiso() {
                const tipo = document.getElementById('ptTipo').value;
                const ubi = document.getElementById('ptUbi').value;
                const resp = document.getElementById('ptResp').value;
                const vig = document.getElementById('ptVigencia').value;

                if (!ubi || !vig) return App.toast('Complete todos los campos', 'error');

                const fotoId = await App.uploadPhoto('ptFoto');

                App.toast('Autorizando permiso...', 'info');
                const res = await App.api('registrarPermisoTrabajo', {
                    tipo: tipo, ubicacion: ubi, responsableIt: resp, vigencia: vig, userId: App.user.id, fotoId: fotoId
                });
                if (res.success) {
                    App.toast('Permiso Autorizado: ' + res.id, 'success');
                    Pages['permisos-ambiental']();
                }
            },
            async submitAmbiental() {
                const desc = document.getElementById('ambDesc').value;
                const cant = document.getElementById('ambCant').value;
                if (!desc || !cant) return App.toast('Faltan datos', 'error');

                App.toast('Registrando residuo...', 'info');
                const res = await App.api('registrarLogAmbiental', {
                    tipoResiduo: document.getElementById('ambTipo').value + ' - ' + desc,
                    cantidad: cant,
                    unidad: document.getElementById('ambUnidad').value,
                    disposicion: document.getElementById('ambDisp').value,
                    manifiesto: document.getElementById('ambManif').value,
                    userId: App.user.id
                });
                if (res.success) {
                    App.toast('Registro Ambiental Exitoso: ' + res.id, 'success');
                    Pages['permisos-ambiental']();
                }
            }

        };

        App.init();
    </script>
</body>
