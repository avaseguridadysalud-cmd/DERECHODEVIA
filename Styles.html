<style>
    /* ================================================================
   DmV Control v3.0 — SISTEMA PREMIUM (MODULAR APPSCRIPT VERSION)
   Archivo: Styles.html
   ================================================================ */

    :root {
        --bg-primary: #0f172a;
        --bg-secondary: #0b1121;
        --bg-card: rgba(30, 41, 59, 0.7);
        --bg-input: rgba(15, 23, 42, 0.6);
        --border-color: rgba(255, 255, 255, 0.1);
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --accent-primary: #38bdf8;
        --accent-secondary: #818cf8;
        --accent-success: #34d399;
        --accent-warning: #fbbf24;
        --accent-danger: #f87171;
        --accent-orange: #fb923c;
        --accent-purple: #c084fc;
        --accent-teal: #2dd4bf;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 20px;
        --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.2);
        --shadow-elevated: 0 10px 40px rgba(0, 0, 0, 0.5);
        --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        --font-main: 'IBM Plex Sans', sans-serif;
        --bottom-nav-height: 56px;
    }

    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        font-size: 15px;
    }

    body {
        font-family: var(--font-main);
        background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        color: var(--text-primary);
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
    }

    .hidden {
        display: none !important;
    }

    .flex {
        display: flex;
    }

    .items-center {
        align-items: center;
    }

    .gap-sm {
        gap: 8px;
    }

    .gap-md {
        gap: 16px;
    }

    .w-full {
        width: 100%;
    }

    .text-center {
        text-align: center;
    }

    .text-sm {
        font-size: 0.8rem;
    }

    .text-xs {
        font-size: 0.72rem;
    }

    .text-muted {
        color: var(--text-muted);
    }

    .mt-1 {
        margin-top: 8px;
    }

    .mt-2 {
        margin-top: 16px;
    }

    .mb-1 {
        margin-bottom: 8px;
    }

    .mb-2 {
        margin-bottom: 16px;
    }

    .p-1 {
        padding: 8px;
    }

    .p-2 {
        padding: 16px;
    }

    /* --- BUTTONS --- */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 20px;
        border: none;
        border-radius: var(--radius-sm);
        font-family: var(--font-main);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .btn-primary {
        background: var(--accent-primary);
        color: #0b1121;
    }

    .btn-primary:hover:not(:disabled) {
        filter: brightness(1.15);
        transform: translateY(-1px);
    }

    .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
    }

    .btn-danger {
        background: var(--accent-danger);
        color: #fff;
    }

    .btn-block {
        width: 100%;
    }

    .btn-sm {
        padding: 6px 12px;
        font-size: 0.78rem;
    }

    .btn-icon {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
    }

    /* --- FORMS --- */
    .form-group {
        margin-bottom: 16px;
    }

    .form-label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-secondary);
    }

    .form-input,
    .form-select,
    .form-textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background: var(--bg-input);
        color: var(--text-primary);
        font-family: var(--font-main);
        font-size: 0.9rem;
        transition: border-color var(--transition);
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .form-textarea {
        resize: vertical;
        min-height: 80px;
    }

    .form-row {
        display: flex;
        gap: 12px;
    }

    .form-row .form-group {
        flex: 1;
    }

    /* --- CARDS --- */
    .card {
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border-radius: var(--radius-lg);
        padding: 24px;
        border: 1px solid var(--border-color);
        margin-bottom: 16px;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
    }

    .card-title {
        font-size: 1rem;
        font-weight: 700;
    }

    .card-subtitle {
        font-size: 0.8rem;
        color: var(--text-muted);
    }

    /* --- TABLES --- */
    .table-wrap {
        overflow-x: auto;
        border-radius: var(--radius-sm);
    }

    .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
    }

    .table th,
    .table td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
    }

    .table th {
        font-weight: 600;
        color: var(--text-muted);
        white-space: nowrap;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .table tbody tr:hover {
        background: rgba(255, 255, 255, 0.03);
    }

    /* --- BADGES --- */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 600;
    }

    .badge-green {
        background: rgba(52, 211, 153, 0.15);
        color: var(--accent-success);
    }

    .badge-blue {
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent-primary);
    }

    .badge-orange {
        background: rgba(251, 146, 60, 0.15);
        color: var(--accent-orange);
    }

    .badge-red {
        background: rgba(248, 113, 113, 0.15);
        color: var(--accent-danger);
    }

    .badge-purple {
        background: rgba(192, 132, 252, 0.12);
        color: var(--accent-purple);
    }

    .badge-yellow {
        background: rgba(251, 191, 36, 0.15);
        color: var(--accent-warning);
    }

    .badge-teal {
        background: rgba(45, 212, 191, 0.15);
        color: var(--accent-teal);
    }

    /* --- ALERTS --- */
    .alert-strip {
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        margin-bottom: 12px;
        font-size: 0.85rem;
        border-left: 3px solid;
    }

    .alert-green {
        background: rgba(52, 211, 153, 0.08);
        color: var(--accent-success);
        border-color: var(--accent-success);
    }

    .alert-blue {
        background: rgba(56, 189, 248, 0.08);
        color: var(--accent-primary);
        border-color: var(--accent-primary);
    }

    .alert-orange {
        background: rgba(251, 146, 60, 0.08);
        color: var(--accent-orange);
        border-color: var(--accent-orange);
    }

    .alert-red {
        background: rgba(248, 113, 113, 0.08);
        color: var(--accent-danger);
        border-color: var(--accent-danger);
    }

    /* --- STATS GRID --- */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 20px;
    }

    .stat-card {
        background: var(--bg-card);
        backdrop-filter: blur(6px);
        border-radius: var(--radius-md);
        padding: 18px;
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--accent-primary);
    }

    .stat-label {
        display: block;
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }

    .stat-value {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--text-primary);
    }

    /* --- TOASTS --- */
    #toastContainer {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .toast {
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        background: var(--bg-card);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        font-size: 0.85rem;
        animation: slideIn 0.3s ease;
        box-shadow: var(--shadow-elevated);
    }

    .toast-success,
    .toast.success {
        border-left: 4px solid var(--accent-success);
    }

    .toast-error,
    .toast.error {
        border-left: 4px solid var(--accent-danger);
    }

    .toast-info,
    .toast.info {
        border-left: 4px solid var(--accent-primary);
    }

    .toast-warning,
    .toast.warning {
        border-left: 4px solid var(--accent-warning);
    }

    @keyframes slideIn {
        from {
            transform: translateX(100%);
            opacity: 0;
        }

        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    /* --- MODALS --- */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal {
        background: #1e293b;
        border-radius: var(--radius-lg);
        padding: 28px;
        max-width: 550px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-elevated);
        animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
        from {
            transform: scale(0.95);
            opacity: 0;
        }

        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .modal-title {
        font-size: 1.1rem;
        font-weight: 700;
    }

    .modal-close {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text-muted);
        line-height: 1;
    }

    .modal-body {
        margin-bottom: 20px;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
    }

    /* --- LOGIN SCREEN --- */
    #screen-login {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-banner {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-banner h1 {
        font-size: 2.2rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .login-banner p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    .login-container {
        display: flex;
        justify-content: center;
    }

    .login-box {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        padding: 40px;
        border-radius: 24px;
        width: 100%;
        max-width: 400px;
        box-shadow: var(--shadow-elevated);
        text-align: center;
    }

    .login-box h2 {
        margin-bottom: 8px;
    }

    .login-box p {
        color: var(--text-muted);
        margin-bottom: 20px;
    }

    .pin-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 20px 0;
    }

    .pin-digit {
        width: 100% !important;
        height: 60px !important;
        background: var(--bg-secondary) !important;
        border: 2px solid var(--border-color) !important;
        border-radius: 12px !important;
        color: #fff !important;
        font-size: 1.5rem !important;
        text-align: center !important;
        font-family: var(--font-main);
        transition: all var(--transition);
    }

    .pin-digit:focus {
        border-color: var(--accent-primary) !important;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        outline: none;
    }

    .error-msg {
        color: var(--accent-danger);
        font-size: 0.8rem;
        min-height: 20px;
    }

    /* --- APP LAYOUT --- */
    #app-shell {
        display: flex;
        height: 100vh;
        width: 100vw;
    }

    .sidebar {
        width: 260px;
        background: var(--bg-secondary);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform 0.3s ease;
        z-index: 200;
    }

    .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
    }

    .logo {
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--accent-primary);
    }

    .logo span {
        font-weight: 400;
        color: var(--text-secondary);
    }

    .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
    }

    .nav-section {
        margin-bottom: 8px;
    }

    .nav-section-title {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.3);
        padding: 12px 20px 6px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        margin: 2px 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: all var(--transition);
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .nav-item:hover {
        background: rgba(56, 189, 248, 0.08);
        color: var(--text-primary);
    }

    .nav-item.active {
        background: rgba(56, 189, 248, 0.15);
        color: var(--accent-primary);
        font-weight: 600;
    }

    .nav-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }

    .sidebar-footer {
        padding: 16px;
        border-top: 1px solid var(--border-color);
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }

    .user-avatar {
        width: 36px;
        height: 36px;
        background: var(--accent-primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.8rem;
        color: #0b1121;
        flex-shrink: 0;
    }

    .user-details {
        flex: 1;
        overflow: hidden;
    }

    .user-name {
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .user-status {
        font-size: 0.7rem;
        color: var(--accent-success);
    }

    .btn-logout {
        background: none;
        border: 1px solid rgba(248, 113, 113, 0.3);
        color: var(--accent-danger);
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-size: 0.8rem;
        transition: all var(--transition);
    }

    .btn-logout:hover {
        background: rgba(248, 113, 113, 0.1);
    }

    .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 199;
        display: none;
    }

    .sidebar-overlay.active {
        display: block;
    }

    .main-content {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .topbar {
        height: 60px;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
    }

    .topbar-title {
        font-size: 1rem;
        font-weight: 700;
    }

    .topbar-date {
        font-size: 0.78rem;
        color: var(--text-muted);
    }

    .topbar-role-badge {
        display: inline-flex;
    }

    .btn-hamburger {
        background: none;
        border: none;
        color: var(--text-primary);
        cursor: pointer;
        font-size: 1.3rem;
        padding: 8px;
        display: none;
    }

    .page-content {
        flex: 1;
        padding: 24px;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        overflow-y: auto;
    }

    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
    }

    /* --- BOTTOM NAV (MOBILE) --- */
    .bottom-nav {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: var(--bottom-nav-height);
        background: var(--bg-secondary);
        border-top: 1px solid var(--border-color);
        justify-content: space-around;
        align-items: center;
        z-index: 100;
    }

    .bottom-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 0.6rem;
        color: var(--text-muted);
        cursor: pointer;
        padding: 6px;
    }

    .bottom-nav-item.active {
        color: var(--accent-primary);
    }

    .bottom-nav-item svg {
        width: 20px;
        height: 20px;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            transform: translateX(-100%);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .btn-hamburger {
            display: block;
        }

        .bottom-nav {
            display: flex;
        }

        .page-content {
            padding: 16px;
            padding-bottom: calc(var(--bottom-nav-height) + 16px);
        }

        .stats-grid {
            grid-template-columns: 1fr 1fr;
        }

        .login-banner h1 {
            font-size: 1.6rem;
        }

        .login-box {
            padding: 28px;
        }
    }
</style>
